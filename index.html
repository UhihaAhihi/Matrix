<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Hand Matrix FX</title>
    <!-- MediaPipe Hands & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #020205;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            display: none;
        }
        canvas {
            border: 1px solid #1a2634;
            max-width: 100%;
            max-height: 100vh;
            transform: scaleX(-1); /* Gương soi */
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            letter-spacing: 2px;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="loading">CONNECTING NEURAL CAMERA...</div>

    <div class="container">
        <video id="input_video" autoplay playsinline></video>
        <canvas id="output_canvas" width="1280" height="720"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const loadingText = document.getElementById('loading');

        // Canvas đệm xử lý điểm ảnh
        const offCanvas = document.createElement('canvas');
        const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });
        offCanvas.width = 1280;
        offCanvas.height = 720;

        const pixelCanvas = document.createElement('canvas');
        const pixelCtx = pixelCanvas.getContext('2d');

        // Định nghĩa 4 dải ngón tay: 4: Cái, 8: Trỏ, 12: Giữa, 16: Áp út, 20: Út
        const ALL_POSSIBLE_ZONES = [
            { i1: 4,  i2: 8,  color: "#00ffff" },
            { i1: 8,  i2: 12, color: "#ff007f" },
            { i1: 12, i2: 16, color: "#39ff14" },
            { i1: 16, i2: 20, color: "#bd00ff" }
        ];

        // Kho hiệu ứng nhiễu công nghệ cao
        const FX_LIST = [
            'rgb_glitch',
            'hologram_scan',
            'neon_edge',
            'night_vision',
            'digital_pixel',
            'matrix_code'
        ];

        let activeZoneCount = 1; // Mặc định chỉ 1 vùng (4 ngón: cái + trỏ 2 tay)
        let lastZoneTime = 0;
        let lastFXTime = 0;
        let assignedFX = [];
        let scanlineOffset = 0;

        function shuffleFX() {
            const shuffled = [...FX_LIST].sort(() => 0.5 - Math.random());
            assignedFX = shuffled.slice(0, 4);
        }
        shuffleFX();

        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        // 1. Hiệu ứng RGB Split & Glitch Wave (Nhiễu tách màu & xô lệch khung)
        function renderRGBGlitch(image, w, h) {
            offCtx.drawImage(image, 0, 0, w, h);
            const imgData = offCtx.getImageData(0, 0, w, h);
            const data = imgData.data;
            const shift = 10 + Math.floor(Math.random() * 8);

            // Tách màu kênh Red và Blue
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const idx = (y * w + x) * 4;
                    const shiftIdx = (y * w + Math.min(w - 1, x + shift)) * 4;
                    data[idx] = data[shiftIdx]; // Dịch kênh đỏ
                }
            }
            offCtx.putImageData(imgData, 0, 0);

            // Cắt xén ngẫu nhiên các lát sọc (glitch slices)
            for (let i = 0; i < 4; i++) {
                const sliceY = Math.random() * h;
                const sliceH = Math.random() * 25 + 5;
                const offset = (Math.random() - 0.5) * 35;
                offCtx.drawImage(image, 0, sliceY, w, sliceH, offset, sliceY, w, sliceH);
            }
        }

        // 2. Hiệu ứng Hologram Cyber Scanline (Tia quét laser & màn chiếu 3D)
        function renderHologram(image, w, h) {
            offCtx.drawImage(image, 0, 0, w, h);
            // Lớp màu xanh Cyan công nghệ
            offCtx.fillStyle = 'rgba(0, 240, 255, 0.28)';
            offCtx.fillRect(0, 0, w, h);

            // Đường quét tia sáng chuyển động liên tục
            scanlineOffset = (scanlineOffset + 6) % h;
            offCtx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            offCtx.fillRect(0, scanlineOffset, w, 4);

            // Lưới sọc màn hình CRT
            offCtx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            for (let y = 0; y < h; y += 4) {
                offCtx.fillRect(0, y, w, 2);
            }
        }

        // 3. Hiệu ứng Neon Edge (Dò cạnh viền phát quang)
        function renderNeonEdge(image, w, h) {
            offCtx.drawImage(image, 0, 0, w, h);
            const imgData = offCtx.getImageData(0, 0, w, h);
            const data = imgData.data;
            const gray = new Uint8Array(w * h);

            for (let i = 0; i < data.length; i += 4) {
                gray[i / 4] = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
            }

            for (let y = 1; y < h - 1; y += 2) {
                for (let x = 1; x < w - 1; x += 2) {
                    const idx = y * w + x;
                    const gx = -gray[idx - w - 1] + gray[idx - w + 1] - 2 * gray[idx - 1] + 2 * gray[idx + 1] - gray[idx + w - 1] + gray[idx + w + 1];
                    const gy = -gray[idx - w - 1] - 2 * gray[idx - w] - gray[idx - w + 1] + gray[idx + w - 1] + 2 * gray[idx + w] + gray[idx + w + 1];
                    const edge = Math.sqrt(gx * gx + gy * gy);

                    const pIdx = idx * 4;
                    if (edge > 40) {
                        data[pIdx] = 255;       // R (Tím Neon)
                        data[pIdx + 1] = 0;     // G
                        data[pIdx + 2] = 220;   // B
                    } else {
                        data[pIdx] = 10;
                        data[pIdx + 1] = 10;
                        data[pIdx + 2] = 18;
                    }
                }
            }
            offCtx.putImageData(imgData, 0, 0);
        }

        // 4. Hiệu ứng Night Vision & Noise (Kính nhìn đêm & hạt nhiễu điện tử)
        function renderNightVision(image, w, h) {
            offCtx.drawImage(image, 0, 0, w, h);
            offCtx.fillStyle = 'rgba(20, 255, 80, 0.3)';
            offCtx.fillRect(0, 0, w, h);

            // Nhiễu hạt muối tiêu digital noise
            const imgData = offCtx.getImageData(0, 0, w, h);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 16) {
                const noise = (Math.random() - 0.5) * 65;
                data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + noise)); // Kênh Green
            }
            offCtx.putImageData(imgData, 0, 0);
        }

        // 5. Hiệu ứng Pixelate Digital Mesh
        function renderDigitalPixel(image, w, h, size = 16) {
            pixelCanvas.width = Math.max(1, w / size);
            pixelCanvas.height = Math.max(1, h / size);
            pixelCtx.drawImage(image, 0, 0, pixelCanvas.width, pixelCanvas.height);
            offCtx.imageSmoothingEnabled = false;
            offCtx.drawImage(pixelCanvas, 0, 0, pixelCanvas.width, pixelCanvas.height, 0, 0, w, h);
            offCtx.imageSmoothingEnabled = true;

            // Kẻ lưới ô vuông tech
            offCtx.strokeStyle = 'rgba(0, 255, 200, 0.15)';
            offCtx.lineWidth = 1;
            for (let x = 0; x < w; x += size) {
                offCtx.beginPath(); offCtx.moveTo(x, 0); offCtx.lineTo(x, h); offCtx.stroke();
            }
            for (let y = 0; y < h; y += size) {
                offCtx.beginPath(); offCtx.moveTo(0, y); offCtx.lineTo(w, y); offCtx.stroke();
            }
        }

        // 6. Hiệu ứng Ma trận xanh số hoá
        function renderMatrixCode(image, w, h) {
            offCtx.drawImage(image, 0, 0, w, h);
            offCtx.fillStyle = 'rgba(0, 15, 5, 0.6)';
            offCtx.fillRect(0, 0, w, h);

            offCtx.fillStyle = '#39ff14';
            offCtx.font = '10px Courier New';
            const chars = '01XYZ$#%*';
            for (let y = 15; y < h; y += 22) {
                for (let x = 10; x < w; x += 35) {
                    if (Math.random() > 0.45) {
                        offCtx.fillText(chars[Math.floor(Math.random() * chars.length)], x, y);
                    }
                }
            }
        }

        function onResults(results) {
            loadingText.style.display = 'none';
            const w = canvasElement.width;
            const h = canvasElement.height;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, w, h);
            // Nền camera gốc
            canvasCtx.drawImage(results.image, 0, 0, w, h);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length >= 2) {
                let hA = results.multiHandLandmarks[0];
                let hB = results.multiHandLandmarks[1];
                if (hA[0].x > hB[0].x) {
                    const temp = hA; hA = hB; hB = temp;
                }

                const now = Date.now();

                // Chụm Cái + Út để TĂNG DẦN SỐ VÙNG (1 -> 4)
                const pinchPinkyA = getDistance(hA[4], hA[20]) < 0.04;
                const pinchPinkyB = getDistance(hB[4], hB[20]) < 0.04;
                if ((pinchPinkyA || pinchPinkyB) && now - lastZoneTime > 750) {
                    activeZoneCount = (activeZoneCount % 4) + 1;
                    lastZoneTime = now;
                }

                // Chụm Cái + Trỏ để ĐỔI HIỆU ỨNG (không trùng lặp)
                const pinchIndexA = getDistance(hA[4], hA[8]) < 0.035;
                const pinchIndexB = getDistance(hB[4], hB[8]) < 0.035;
                if ((pinchIndexA || pinchIndexB) && now - lastFXTime > 750) {
                    shuffleFX();
                    lastFXTime = now;
                }

                // Vẽ từng vùng hiệu ứng
                for (let i = 0; i < activeZoneCount; i++) {
                    const zone = ALL_POSSIBLE_ZONES[i];
                    const fx = assignedFX[i];

                    const p1 = { x: hA[zone.i1].x * w, y: hA[zone.i1].y * h };
                    const p2 = { x: hA[zone.i2].x * w, y: hA[zone.i2].y * h };
                    const p3 = { x: hB[zone.i2].x * w, y: hB[zone.i2].y * h };
                    const p4 = { x: hB[zone.i1].x * w, y: hB[zone.i1].y * h };

                    canvasCtx.save();
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(p1.x, p1.y);
                    canvasCtx.lineTo(p2.x, p2.y);
                    canvasCtx.lineTo(p3.x, p3.y);
                    canvasCtx.lineTo(p4.x, p4.y);
                    canvasCtx.closePath();
                    canvasCtx.clip();

                    // Render hiệu ứng tương ứng
                    if (fx === 'rgb_glitch') {
                        renderRGBGlitch(results.image, w, h);
                        canvasCtx.drawImage(offCanvas, 0, 0, w, h);
                    } else if (fx === 'hologram_scan') {
                        renderHologram(results.image, w, h);
                        canvasCtx.drawImage(offCanvas, 0, 0, w, h);
                    } else if (fx === 'neon_edge') {
                        renderNeonEdge(results.image, w, h);
                        canvasCtx.drawImage(offCanvas, 0, 0, w, h);
                    } else if (fx === 'night_vision') {
                        renderNightVision(results.image, w, h);
                        canvasCtx.drawImage(offCanvas, 0, 0, w, h);
                    } else if (fx === 'digital_pixel') {
                        renderDigitalPixel(results.image, w, h, 18);
                        canvasCtx.drawImage(offCanvas, 0, 0, w, h);
                    } else if (fx === 'matrix_code') {
                        renderMatrixCode(results.image, w, h);
                        canvasCtx.drawImage(offCanvas, 0, 0, w, h);
                    }
                    canvasCtx.restore();

                    // Viền khung laser công nghệ mảnh và sắc nét
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(p1.x, p1.y);
                    canvasCtx.lineTo(p2.x, p2.y);
                    canvasCtx.lineTo(p3.x, p3.y);
                    canvasCtx.lineTo(p4.x, p4.y);
                    canvasCtx.closePath();
                    canvasCtx.lineWidth = 1.8;
                    canvasCtx.strokeStyle = zone.color;
                    canvasCtx.shadowColor = zone.color;
                    canvasCtx.shadowBlur = 12;
                    canvasCtx.stroke();
                }

                // Vẽ toạ độ HUD & Tâm ngắm công nghệ trên các đầu ngón tay đang kích hoạt
                const activeJoints = new Set();
                for (let i = 0; i < activeZoneCount; i++) {
                    activeJoints.add(ALL_POSSIBLE_ZONES[i].i1);
                    activeJoints.add(ALL_POSSIBLE_ZONES[i].i2);
                }

                [hA, hB].forEach(hand => {
                    activeJoints.forEach(jointIdx => {
                        const pt = hand[jointIdx];
                        const px = pt.x * w;
                        const py = pt.y * h;

                        // Tâm ngắm hồng ngoại tròn + chữ thập
                        canvasCtx.shadowBlur = 0;
                        canvasCtx.beginPath();
                        canvasCtx.arc(px, py, 5, 0, 2 * Math.PI);
                        canvasCtx.strokeStyle = '#00ffff';
                        canvasCtx.lineWidth = 1.2;
                        canvasCtx.stroke();

                        canvasCtx.beginPath();
                        canvasCtx.moveTo(px - 9, py); canvasCtx.lineTo(px + 9, py);
                        canvasCtx.moveTo(px, py - 9); canvasCtx.lineTo(px, py + 9);
                        canvasCtx.strokeStyle = 'rgba(0, 255, 255, 0.6)';
                        canvasCtx.lineWidth = 1;
                        canvasCtx.stroke();

                        // Chỉ số toạ độ kỹ thuật số siêu nhỏ, lơ lửng sát cạnh ngón tay
                        canvasCtx.fillStyle = '#00ffff';
                        canvasCtx.font = '8px monospace';
                        canvasCtx.fillText(`${px.toFixed(0)},${py.toFixed(0)}`, px + 8, py - 6);
                        canvasCtx.fillStyle = '#ff007f';
                        canvasCtx.fillText(`Z:${(pt.z * -100).toFixed(0)}`, px + 8, py + 4);
                    });
                });
            }

            canvasCtx.restore();
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });

        camera.start();
    </script>
</body>
</html>
